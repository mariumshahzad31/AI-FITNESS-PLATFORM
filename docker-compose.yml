services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_password}
      POSTGRES_DB: ai_fitness_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_user -d ai_fitness_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: "8000"
      FRONTEND_ORIGIN: http://localhost:3000
      BACKEND_ORIGIN: http://localhost:5000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: development
      DATABASE_URL: postgres://fitness_user:${POSTGRES_PASSWORD:-fitness_password}@db:5432/ai_fitness_platform
      FRONTEND_ORIGIN: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: "30000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: "7"
      BCRYPT_ROUNDS: "10"
    ports:
      - "5000:5000"
    command: ["sh", "-c", "node scripts/seed.js && node src/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pgdata:
